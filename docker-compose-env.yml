# =================================================================
# 衍序 · AlgoFlow 基础设施环境部署配置
# 包含：MySQL、Redis、Nacos、RabbitMQ、Elasticsearch、Logstash、Prometheus、Grafana
# 使用方式：docker compose -f docker-compose-env.yml up -d
# =================================================================

services:
  # MySQL 关系型数据库
  mysql:
    image: mysql:8.0
    container_name: algorithm-mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-algorithm}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/algorithm.sql:/docker-entrypoint-initdb.d/algorithm.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
    networks:
      - algorithm-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 分布式缓存与锁
  redis:
    image: redis:7.0
    container_name: algorithm-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-123456}
    networks:
      - algorithm-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos 注册中心和配置中心
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: algorithm-nacos
    restart: always
    environment:
      - MODE=standalone
      - TIME_ZONE=${TZ:-Asia/Shanghai}
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-security}
      - NACOS_AUTH_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_AUTH_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
      - JAVA_OPT_EXT=-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=128m
    volumes:
      - nacos-logs:/home/nacos/logs
      - nacos-data:/home/nacos/data
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks:
      - algorithm-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # RabbitMQ 异步解耦消息队列
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: algorithm-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - algorithm-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch 全文检索与向量存储
  elasticsearch:
    image: elasticsearch:8.19.10
    container_name: algorithm-elasticsearch
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - algorithm-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ELK 日志汇聚
  logstash:
    image: logstash:8.19.0
    container_name: algorithm-logstash
    restart: always
    ports:
      - "5000:5000"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    networks:
      - algorithm-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Prometheus 监控指标采集
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: algorithm-prometheus
    restart: always
    ports:
      - "9090:9090"
    command:
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - algorithm-network

  # Grafana 可视化大屏监控 (默认映射 3100 端口，避开 3000 前端端口)
  grafana:
    image: grafana/grafana:11.4.0
    container_name: algorithm-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - algorithm-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  nacos-data:
    driver: local
  nacos-logs:
    driver: local
  rabbitmq-data:
    driver: local
  elasticsearch-data:
    driver: local

networks:
  algorithm-network:
    name: algorithm-network
    driver: bridge

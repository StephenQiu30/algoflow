# =================================================================
# 衍序 · AlgoFlow 全栈微服务与前端应用部署配置
# 包含：Frontend (Next.js) + Gateway + 8 个业务微服务
# 使用方式：docker compose up -d --build
# =================================================================

services:
  # -------------------------------------------------------------
  # 前端应用 (Next.js 15 / React 19 / GSAP / Radix UI)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: algoflow-frontend:${ALGOFLOW_VERSION:-latest}
    container_name: algoflow-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    networks:
      - algorithm-network

  # -------------------------------------------------------------
  # API 网关服务 (Spring Cloud Gateway)
  # -------------------------------------------------------------
  algorithm-gateway:
    build:
      context: ./backend
      dockerfile: algorithm-gateway/Dockerfile
    image: algorithm-gateway:${ALGOFLOW_VERSION:-latest}
    container_name: algorithm-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT_EXTERNAL:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST:-algorithm-nacos}:${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST:-algorithm-nacos}:${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - algorithm-network

  # -------------------------------------------------------------
  # 用户与认证服务
  # -------------------------------------------------------------
  algorithm-user-service:
    build:
      context: ./backend
      dockerfile: algorithm-service/algorithm-user-service/Dockerfile
